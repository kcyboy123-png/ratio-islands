name: Deploy ratio islands
on:
  push:
    branches: [main]
    paths: ['.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Verify and unpack release
        run: |
          curl --fail --location --retry 3 -o site.zip https://github.com/kcyboy123-png/ratio-islands/releases/download/v1.0.0/ratio-islands-site.zip
          echo 'c364bb4bd8d7d3cfaa50e0bd71dfa37f0f95254a7250b0a46989328ccf743fd3  site.zip' | sha256sum -c -
          unzip -q site.zip -d site
          test -f site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deploy
