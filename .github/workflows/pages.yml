name: Deploy ratio islands
on:
  push:
    branches: [main]
    paths: ['.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify and unpack release
        run: |
          curl --fail --location --retry 3 -o site.zip https://github.com/kcyboy123-png/ratio-islands/releases/download/v1.0.1/ratio-islands-site-v101.zip
          echo '6aa0f9eef9ecd80a9227dce3dc982c2a998131b0e24745647c43bf09d8d0a61d  site.zip' | sha256sum -c -
          unzip -q site.zip -d site
          curl --fail --location --retry 3 -o entrance.zip https://github.com/kcyboy123-png/ratio-islands/releases/download/v1.0.2/ratio-islands-entrance-v102.zip
          echo '83a439685656659e93f458c30a3072d41e442894551a1d107d559fc834b588d6  entrance.zip' | sha256sum -c -
          unzip -oq entrance.zip -d site
          test -f site/assets/cinematics/entrance-harbor.webp
          curl --fail --location --retry 3 -o gameplay.zip https://github.com/kcyboy123-png/ratio-islands/releases/download/v1.0.3/ratio-islands-entry-v103.zip
          echo '5478fa64e8ef5eac228d8470d3992080155ad48eb06a57c63daaffbe3e816dae  gameplay.zip' | sha256sum -c -
          unzip -oq gameplay.zip -d site
          test -f site/assets/cinematics/entrance-loop-mobile.mp4
          curl --fail --location --retry 3 -o awards.zip https://github.com/kcyboy123-png/ratio-islands/releases/download/v1.0.4/ratio-islands-v104.zip
          echo 'aac25f80eb2a42314d1d5b7a66766220c8b0f2d16aade00dd4469aae96534fe7  awards.zip' | sha256sum -c -
          unzip -oq awards.zip -d site
          test -s site/assets/cinematics/voyage-ending-mobile.mp4
          test -s site/assets/cinematics/voyage-ending.mp4
          test -s site/assets/tiers/emerald.svg
          cp releases/v105/{main.js,boot.js,index.html} site/
          node --check site/main.js
          grep -Fq "boot.js?v=105" site/index.html
          grep -Fq "main.js?v=105" site/boot.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deploy
